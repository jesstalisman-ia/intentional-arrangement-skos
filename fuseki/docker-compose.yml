# Ready-to-run Apache Jena Fuseki for the SKOS editor's "Publish to server".
#
# Fuseki itself doesn't send CORS headers, and the browser app is on another
# origin, so Caddy sits in front and adds them (and handles the preflight).
#
#   docker compose up -d
#   # then in the app: Export -> Connections -> http://localhost:3030/skos
#
# Lock this down before exposing it publicly (see README.md).
services:
  fuseki:
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: "${FUSEKI_ADMIN_PASSWORD:-change-me}"
    volumes:
      - fuseki-data:/fuseki
      # config.ttl defines the /skos dataset with a UNION default graph, so a plain
      # SELECT ?s ?p ?o sees data the app publishes into per-project named graphs.
      - ./config.ttl:/fuseki/config.ttl:ro
    expose:
      - "3030"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [fuseki]
    ports:
      - "3030:3030"                   # the app connects here
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  fuseki-data:
